<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baja completada — Resumen de prensa</title>
<style>
  :root{--bg:#f7f6f3;--card:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--accent:#c0392b;--border:#e3e1dc;--ok:#059669}
  @media (prefers-color-scheme:dark){:root{--bg:#1a1a1b;--card:#242426;--fg:#ececea;--muted:#9a9a97;--accent:#e05a4a;--border:#3a3a3d;--ok:#34d399}}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .box{max-width:520px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:14px;text-align:center}
  .ic{font-size:46px}
  h1{font-size:1.35rem;margin:10px 0}
  a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="ic">👋</div>
    <h1 style="color:var(--ok)">Te has dado de baja</h1>
    <p>Tus datos se han eliminado y no recibirás más correos. Gracias por haber estado.</p>
    <p><a href="qa.html">Volver a la web →</a> · <a href="suscribirse.html">Volver a suscribirme</a></p>
  </div>
  <script>
    if(new URLSearchParams(location.search).get("e")){
      document.getElementById("box").innerHTML=
        '<div class="ic">⚠️</div><h1 style="color:var(--accent)">Enlace no válido</h1>'+
        '<p>Este enlace de baja no es válido o ya te habías dado de baja.</p>'+
        '<p><a href="qa.html">Volver a la web →</a></p>';
    }
  </script>
</body>
</html>
