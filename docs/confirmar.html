<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirma tu suscripción — Resumen de prensa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=3">
<script src="tema.js?v=3"></script>
</head>
<body>
<header class="top">
  <div class="contenedor top-in">
    <a class="marca" href="index.html"><span class="marca-logo">R</span>Resumen de prensa</a>
    <div class="top-acciones"><button class="btn-icono" data-tema type="button"></button></div>
  </div>
</header>
<main class="contenedor">
  <div class="tarjeta estado" id="caja">
    <h1>Confirma tu suscripción</h1>
    <p>Pulsa el botón para empezar a recibir cada mañana el resumen de prensa, con tus temas primero.</p>
    <form id="form" method="post">
      <input type="hidden" name="token" id="token">
      <div class="acciones"><button class="btn btn-accent" type="submit">Confirmar mi suscripción</button></div>
    </form>
  </div>
</main>
<script>
  // El enlace del correo trae ?token=...; el botón lo envía a la función de Supabase.
  // Abrir esta página no hace nada por sí solo (los escáneres de enlaces no pulsan botones).
  const API_BASE = "https://juzyajcwmoqrqkzwywvh.supabase.co/functions/v1";
  const token = new URLSearchParams(location.search).get("token") || "";
  if (!/^[0-9a-f-]{36}$/i.test(token)) location.replace("confirmado.html?e=1");
  document.getElementById("token").value = token;
  document.getElementById("form").action = API_BASE + "/confirm";
  document.getElementById("form").addEventListener("submit", e => { const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Un momento…"; });
</script>
</body>
</html>
