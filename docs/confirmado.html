<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suscripción confirmada — Resumen de prensa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=3">
<script src="tema.js?v=3"></script>
</head>
<body>
<header class="top">
  <div class="contenedor top-in">
    <a class="marca" href="index.html"><span class="marca-logo">R</span>Resumen de prensa</a>
    <div class="top-acciones"><button class="btn-icono" data-tema type="button"></button></div>
  </div>
</header>
<main class="contenedor">
  <div class="tarjeta estado" id="caja">
    <div class="estado-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>¡Suscripción confirmada!</h1>
    <p>Desde mañana recibirás el resumen de prensa cada mañana, con tus temas primero.</p>
    <div class="acciones"><a class="btn btn-accent" href="index.html">Ver las noticias de hoy</a></div>
  </div>
</main>
<script>
  if(new URLSearchParams(location.search).get("e")){
    document.title="Enlace no válido — Resumen de prensa";
    document.getElementById("caja").innerHTML=
      '<div class="estado-icono mal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>'+
      '<h1>Este enlace no funciona</h1>'+
      '<p>Puede que ya lo hayas usado o que haya caducado. Si aún no recibes el boletín, vuelve a darte de alta.</p>'+
      '<div class="acciones"><a class="btn btn-accent" href="suscribirse.html">Darme de alta</a><a class="btn btn-linea" href="index.html">Ver las noticias</a></div>';
  }
</script>
</body>
</html>
