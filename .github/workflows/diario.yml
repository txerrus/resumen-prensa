name: Boletín diario

on:
  schedule:
    # GitHub solo admite UTC. Las 09:30 en España son 07:30 UTC en horario de verano
    # y 08:30 UTC en horario de invierno: se programan las dos y el job "hora" deja
    # pasar solo la que toca según la hora oficial de Madrid.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write            # para volver a publicar docs/digest-latest.json

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - id: comprobar
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # Desfase actual de Madrid: +0200 (verano) o +0100 (invierno)
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "$EVENTO" != "schedule" ]; then
            toca=true
          elif [ "$desfase" = "+0200" ] && [ "$CRON" = "30 7 * * *" ]; then
            toca=true
          elif [ "$desfase" = "+0100" ] && [ "$CRON" = "30 8 * * *" ]; then
            toca=true
          else
            toca=false
          fi
          echo "Evento=$EVENTO cron=\"$CRON\" desfase Madrid=$desfase -> toca=$toca"
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

  enviar:
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Generar el resumen del día
        run: node digest.js --sin-correo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

      - name: Enviar a los suscriptores
        run: node enviar.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: "Resumen de prensa"

      - name: Publicar la web actualizada
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/digest-latest.json
          git commit -m "Actualiza noticias del día [skip ci]" || echo "sin cambios"
          git push
